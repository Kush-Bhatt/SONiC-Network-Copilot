! IOS-style configuration for Batfish
! T1 VLAN Topology - VS-4 (transit, no BGP, static routes only)
! Links to VS-1 and VS-2
!
frr version 10.5.1
frr defaults traditional
hostname VS-4
!
interface Loopback0
 ip address 10.1.0.1/32
!
interface Ethernet4
 ip address 10.0.24.2/30
 mtu 9100
 no shutdown
!
interface Ethernet8
 ip address 192.168.100.5/24
 mtu 9100
 no shutdown
!
interface Ethernet12
 ip address 10.0.14.2/30
 mtu 9100
 no shutdown
!
ip route 10.0.1.0/24 10.0.14.1
ip route 10.0.2.0/24 10.0.24.1
!
end
