! IOS-style configuration for Batfish
! T1 VLAN Topology - VS-1 (no BGP, static routes only)
! Vlan100 host network: 10.0.1.1/24 | Links to VS-3, VS-4
!
frr version 10.5.1
frr defaults traditional
hostname VS-1
!
interface Loopback0
 ip address 10.1.0.1/32
!
interface Vlan100
 ip address 10.0.1.1/24
!
interface Ethernet4
 switchport
 switchport mode access
 switchport access vlan 100
 mtu 9100
 no shutdown
!
interface Ethernet8
 ip address 192.168.100.2/24
 mtu 9100
 no shutdown
!
interface Ethernet12
 ip address 10.0.13.1/30
 mtu 9100
 no shutdown
!
interface Ethernet16
 ip address 10.0.14.1/30
 mtu 9100
 no shutdown
!
ip route 10.0.2.0/24 10.0.13.2
ip route 10.0.2.0/24 10.0.14.2
!
end
