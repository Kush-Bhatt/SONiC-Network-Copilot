! IOS-style configuration for Batfish
! T1 VLAN Topology - VS-3 (transit, no BGP, static routes only)
! Links to VS-1 and VS-2
!
frr version 10.5.1
frr defaults traditional
hostname VS-3
!
interface Loopback0
 ip address 10.1.0.1/32
!
interface Ethernet4
 ip address 10.0.13.2/30
 mtu 9100
 no shutdown
!
interface Ethernet8
 ip address 192.168.100.4/24
 mtu 9100
 no shutdown
!
interface Ethernet12
 ip address 10.0.23.2/30
 mtu 9100
 no shutdown
!
ip route 10.0.1.0/24 10.0.13.1
ip route 10.0.2.0/24 10.0.23.1
!
end
