! IOS-style configuration for Batfish
! Leaf-Spine BGP Topology - VS-2 (Leaf-2, AS 65002)
! No loopback, no network advertisement. Peers: VS-3, VS-4 (Spines, AS 65000)
!
frr version 10.5.1
frr defaults traditional
hostname VS-2
!
interface Ethernet12
 ip address 10.0.24.1/30
 no shutdown
!
interface Ethernet16
 ip address 10.0.23.1/30
 no shutdown
!
router bgp 65002
 bgp router-id 10.0.23.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.0.24.2 remote-as 65000
 neighbor 10.0.24.2 description VS-4-Spine2
 neighbor 10.0.24.2 timers 3 9
 neighbor 10.0.23.2 remote-as 65000
 neighbor 10.0.23.2 description VS-3-Spine1
 neighbor 10.0.23.2 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.0.24.2 activate
  neighbor 10.0.24.2 soft-reconfiguration inbound
  neighbor 10.0.23.2 activate
  neighbor 10.0.23.2 soft-reconfiguration inbound
 exit-address-family
!
end
