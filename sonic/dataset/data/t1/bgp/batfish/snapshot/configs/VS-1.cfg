! IOS-style configuration for Batfish
! Leaf-Spine BGP Topology - VS-1 (Leaf-1, AS 65001)
! Loopback0 advertised into BGP. Peers: VS-3, VS-4 (Spines, AS 65000)
!
frr version 10.5.1
frr defaults traditional
hostname VS-1
!
interface Loopback0
 ip address 10.1.0.1/32
!
interface Ethernet12
 ip address 10.0.13.1/30
 no shutdown
!
interface Ethernet16
 ip address 10.0.14.1/30
 no shutdown
!
router bgp 65001
 bgp router-id 10.1.0.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.0.13.2 remote-as 65000
 neighbor 10.0.13.2 description VS-3-Spine1
 neighbor 10.0.13.2 timers 3 9
 neighbor 10.0.14.2 remote-as 65000
 neighbor 10.0.14.2 description VS-4-Spine2
 neighbor 10.0.14.2 timers 3 9
 !
 address-family ipv4 unicast
  network 10.1.0.1/32
  neighbor 10.0.13.2 activate
  neighbor 10.0.13.2 soft-reconfiguration inbound
  neighbor 10.0.14.2 activate
  neighbor 10.0.14.2 soft-reconfiguration inbound
 exit-address-family
!
end
