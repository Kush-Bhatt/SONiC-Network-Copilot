! IOS-style configuration for Batfish
! Leaf-Spine BGP Topology - VS-3 (Spine-1, AS 65000)
! Peers: VS-1 (AS 65001), VS-2 (AS 65002)
!
frr version 10.5.1
frr defaults traditional
hostname VS-3
!
interface Ethernet4
 ip address 10.0.13.2/30
 no shutdown
!
interface Ethernet12
 ip address 10.0.23.2/30
 no shutdown
!
router bgp 65000
 bgp router-id 10.0.0.3
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 65001
 neighbor 10.0.13.1 description VS-1-Leaf1
 neighbor 10.0.13.1 timers 3 9
 neighbor 10.0.23.1 remote-as 65002
 neighbor 10.0.23.1 description VS-2-Leaf2
 neighbor 10.0.23.1 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.0.13.1 activate
  neighbor 10.0.13.1 soft-reconfiguration inbound
  neighbor 10.0.23.1 activate
  neighbor 10.0.23.1 soft-reconfiguration inbound
 exit-address-family
!
end
