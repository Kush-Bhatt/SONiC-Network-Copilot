      - { iface: Ethernet12, ip: 10.0.24.1/30 }   # → VS-4
      - { iface: Ethernet16, ip: 10.0.23.1/30 }   # → VS-3
    neighbors:
      - { ip: 10.0.24.2, remote_asn: 65000, desc: VS-4-Spine2 }
      - { ip: 10.0.23.2, remote_asn: 65000, desc: VS-3-Spine1 }

  tasks:
    # --- Remove existing IPs on inter-switch links ---
    - name: Remove existing IPs on VS-2 links
      shell: |
