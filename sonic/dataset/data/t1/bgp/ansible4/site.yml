          echo ' neighbor {{ neighbors[1].ip }} description {{ neighbors[1].desc }}'
          echo ' neighbor {{ neighbors[1].ip }} timers 3 9'
          echo ' address-family ipv4 unicast'
          echo '  neighbor {{ neighbors[0].ip }} activate'
          echo '  neighbor {{ neighbors[0].ip }} soft-reconfiguration inbound'
          echo '  neighbor {{ neighbors[1].ip }} activate'
          echo '  neighbor {{ neighbors[1].ip }} soft-reconfiguration inbound'
