---
########################################
# Leaf-Spine BGP Automation — validate-first style
########################################

- name: Validate spine variables before touching anything
  hosts: spines
  gather_facts: false
  vars:
    spine_config:
      vs-3:
        bgp_asn: 65000
        router_id: 10.0.0.3
        links:
          - { iface: Ethernet4,  ip: 10.0.13.2/30 }
          - { iface: Ethernet12, ip: 10.0.23.2/30 }
        neighbors:
          - { ip: 10.0.13.1, remote_asn: 65001, desc: VS-1-Leaf1 }
          - { ip: 10.0.23.1, remote_asn: 65002, desc: VS-2-Leaf2 }
      vs-4:
        bgp_asn: 65000
        router_id: 10.0.0.4
        links:
          - { iface: Ethernet4,  ip: 10.0.24.2/30 }
          - { iface: Ethernet12, ip: 10.0.14.2/30 }
        neighbors:
          - { ip: 10.0.14.1, remote_asn: 65001, desc: VS-1-Leaf1 }
          - { ip: 10.0.24.1, remote_asn: 65002, desc: VS-2-Leaf2 }

  tasks:
    - name: Set per-host spine vars
      set_fact:
        my_config: "{{ spine_config[inventory_hostname] }}"

    - name: Assert spine config has required fields
      assert:
        that:
          - my_config.bgp_asn is defined
          - my_config.router_id is defined
          - my_config.links | length == 2
          - my_config.neighbors | length == 2
        fail_msg: "{{ inventory_hostname }} spine config incomplete — aborting"
        success_msg: "{{ inventory_hostname }} spine config validated OK"

    - name: Assert each link has iface and ip
      assert:
        that:
          - item.iface is defined
          - item.ip is defined
        fail_msg: "Spine link entry missing iface or ip on {{ inventory_hostname }}"
      loop: "{{ my_config.links }}"

    - name: Assert each neighbor has ip, remote_asn, desc
      assert:
        that:
          - item.ip is defined
          - item.remote_asn is defined
          - item.desc is defined
        fail_msg: "Spine neighbor entry missing fields on {{ inventory_hostname }}"
      loop: "{{ my_config.neighbors }}"

    - name: Build spine config summary
      set_fact:
        spine_summary:
          host: "{{ inventory_hostname }}"
          asn: "{{ my_config.bgp_asn }}"
          router_id: "{{ my_config.router_id }}"
          link_count: "{{ my_config.links | length }}"
          neighbor_count: "{{ my_config.neighbors | length }}"

    - name: Print spine config summary before pushing
      debug:
        var: spine_summary

- name: Configure Spine Switches (VS-3, VS-4)
  hosts: spines
  gather_facts: false
  vars:
    spine_config:
      vs-3:
        bgp_asn: 65000
        router_id: 10.0.0.3
        links:
          - { iface: Ethernet4,  ip: 10.0.13.2/30 }
          - { iface: Ethernet12, ip: 10.0.23.2/30 }
        neighbors:
          - { ip: 10.0.13.1, remote_asn: 65001, desc: VS-1-Leaf1 }
          - { ip: 10.0.23.1, remote_asn: 65002, desc: VS-2-Leaf2 }
      vs-4:
        bgp_asn: 65000
        router_id: 10.0.0.4
        links:
          - { iface: Ethernet4,  ip: 10.0.24.2/30 }
          - { iface: Ethernet12, ip: 10.0.14.2/30 }
        neighbors:
          - { ip: 10.0.14.1, remote_asn: 65001, desc: VS-1-Leaf1 }
          - { ip: 10.0.24.1, remote_asn: 65002, desc: VS-2-Leaf2 }

  tasks:
    - name: Set per-host spine vars
      set_fact:
        my_config: "{{ spine_config[inventory_hostname] }}"

    - name: Remove existing IPs on spine links
      shell: |
        existing=$(show ip interfaces | grep "^{{ item.iface }}" | awk '{print $3}')
        if [ -n "$existing" ]; then
          config interface ip remove {{ item.iface }} $existing
          sleep 1
        fi
      loop: "{{ my_config.links }}"
      ignore_errors: true

    - name: Assign IPs on spine inter-switch links
      shell: |
        config interface ip add {{ item.iface }} {{ item.ip }}
        sleep 1
      loop: "{{ my_config.links }}"

    - name: Remove existing BGP config on spine
      shell: |
        vtysh -c "configure terminal" \
              -c "no router bgp {{ my_config.bgp_asn }}" \
              -c "end"
        sleep 2
      ignore_errors: true

    - name: Configure BGP on spine
      shell: |
        vtysh << 'EOF'
        configure terminal
        router bgp {{ my_config.bgp_asn }}
        bgp router-id {{ my_config.router_id }}
        bgp log-neighbor-changes
        no bgp ebgp-requires-policy
        neighbor {{ my_config.neighbors[0].ip }} remote-as {{ my_config.neighbors[0].remote_asn }}
        neighbor {{ my_config.neighbors[0].ip }} description {{ my_config.neighbors[0].desc }}
        neighbor {{ my_config.neighbors[0].ip }} timers 3 9
        neighbor {{ my_config.neighbors[1].ip }} remote-as {{ my_config.neighbors[1].remote_asn }}
        neighbor {{ my_config.neighbors[1].ip }} description {{ my_config.neighbors[1].desc }}
        neighbor {{ my_config.neighbors[1].ip }} timers 3 9
        address-family ipv4 unicast
        neighbor {{ my_config.neighbors[0].ip }} activate
        neighbor {{ my_config.neighbors[0].ip }} soft-reconfiguration inbound
        neighbor {{ my_config.neighbors[1].ip }} activate
        neighbor {{ my_config.neighbors[1].ip }} soft-reconfiguration inbound
        exit-address-family
        end
        write memory
        EOF
        sleep 3

    - name: Save SONiC config on spine
      shell: config save -y

    - name: Show ip interfaces on spine
      shell: show ip interfaces
      register: iface_out

    - name: Print ip interfaces on spine
      debug:
        var: iface_out.stdout

    - name: Show BGP summary on spine
      shell: vtysh -c "show bgp summary"
      register: bgp_out

    - name: Print BGP summary on spine
      debug:
        var: bgp_out.stdout


- name: Validate VS-1 leaf variables before touching anything
  hosts: vs-1
  gather_facts: false
  vars:
    bgp_asn: 65001
    router_id: 10.1.0.1
    loopback_ip: 10.1.0.1/32
    advertise_prefix: 10.1.0.1/32
    links:
      - { iface: Ethernet12, ip: 10.0.13.1/30 }
      - { iface: Ethernet16, ip: 10.0.14.1/30 }
    neighbors:
      - { ip: 10.0.13.2, remote_asn: 65000, desc: VS-3-Spine1 }
      - { ip: 10.0.14.2, remote_asn: 65000, desc: VS-4-Spine2 }

  tasks:
    - name: Assert VS-1 leaf config has required fields
      assert:
        that:
          - bgp_asn is defined
          - router_id is defined
          - loopback_ip is defined
          - advertise_prefix is defined
          - links | length == 2
          - neighbors | length == 2
        fail_msg: "VS-1 leaf config incomplete — aborting"
        success_msg: "VS-1 leaf config validated OK"

    - name: Build VS-1 config summary
      set_fact:
        vs1_summary:
          asn: "{{ bgp_asn }}"
          loopback: "{{ loopback_ip }}"
          advertises: "{{ advertise_prefix }}"
          link_count: "{{ links | length }}"

    - name: Print VS-1 config summary before pushing
      debug:
        var: vs1_summary

- name: Configure VS-1 Leaf (with loopback advertisement)
  hosts: vs-1
  gather_facts: false
  vars:
    bgp_asn: 65001
    router_id: 10.1.0.1
    loopback_ip: 10.1.0.1/32
    advertise_prefix: 10.1.0.1/32
    links:
      - { iface: Ethernet12, ip: 10.0.13.1/30 }
      - { iface: Ethernet16, ip: 10.0.14.1/30 }
    neighbors:
      - { ip: 10.0.13.2, remote_asn: 65000, desc: VS-3-Spine1 }
      - { ip: 10.0.14.2, remote_asn: 65000, desc: VS-4-Spine2 }

  tasks:
    - name: Remove existing IPs on VS-1 links
      shell: |
        existing=$(show ip interfaces | grep "^{{ item.iface }}" | awk '{print $3}')
        if [ -n "$existing" ]; then
          config interface ip remove {{ item.iface }} $existing
          sleep 1
        fi
      loop: "{{ links }}"
      ignore_errors: true

    - name: Assign IPs on VS-1 inter-switch links
      shell: |
        config interface ip add {{ item.iface }} {{ item.ip }}
        sleep 1
      loop: "{{ links }}"

    - name: Remove ALL existing Loopback0 IPs on VS-1
      shell: |
        for ip in $(show ip interfaces | grep "Loopback0" | awk '{print $3}'); do
          config interface ip remove Loopback0 $ip
          sleep 1
        done
      ignore_errors: true

    - name: Add Loopback0 {{ loopback_ip }} on VS-1
      shell: |
        config interface ip add Loopback0 {{ loopback_ip }}
        sleep 2

    - name: Remove existing BGP config on VS-1
      shell: |
        vtysh -c "configure terminal" \
              -c "no router bgp {{ bgp_asn }}" \
              -c "end"
        sleep 2
      ignore_errors: true

    - name: Configure BGP on VS-1
      shell: |
        vtysh << 'EOF'
        configure terminal
        router bgp {{ bgp_asn }}
        bgp router-id {{ router_id }}
        bgp log-neighbor-changes
        no bgp ebgp-requires-policy
        neighbor {{ neighbors[0].ip }} remote-as {{ neighbors[0].remote_asn }}
        neighbor {{ neighbors[0].ip }} description {{ neighbors[0].desc }}
        neighbor {{ neighbors[0].ip }} timers 3 9
        neighbor {{ neighbors[1].ip }} remote-as {{ neighbors[1].remote_asn }}
        neighbor {{ neighbors[1].ip }} description {{ neighbors[1].desc }}
        neighbor {{ neighbors[1].ip }} timers 3 9
        address-family ipv4 unicast
        network {{ advertise_prefix }}
        neighbor {{ neighbors[0].ip }} activate
        neighbor {{ neighbors[0].ip }} soft-reconfiguration inbound
        neighbor {{ neighbors[1].ip }} activate
        neighbor {{ neighbors[1].ip }} soft-reconfiguration inbound
        exit-address-family
        end
        write memory
        EOF
        sleep 3

    - name: Save SONiC config on VS-1
      shell: config save -y

    - name: Show ip interfaces on VS-1
      shell: show ip interfaces
      register: iface_out

    - name: Print ip interfaces on VS-1
      debug:
        var: iface_out.stdout

    - name: Show BGP summary on VS-1
      shell: vtysh -c "show bgp summary"
      register: bgp_out

    - name: Print BGP summary on VS-1
      debug:
        var: bgp_out.stdout

    - name: Show ip route on VS-1
      shell: ip route
      register: route_out

    - name: Print ip route on VS-1
      debug:
        var: route_out.stdout


