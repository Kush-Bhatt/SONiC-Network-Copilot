---
- name: Clear stale SSH host keys from controller
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove stale known_hosts entry for each switch
      ansible.builtin.shell: |
        ssh-keygen -f "/home/SONICtestbed/.ssh/known_hosts" -R "{{ item }}" 2>/dev/null || true
      loop:
        - 10.0.23.1
        - 10.0.23.2
      changed_when: false

- name: Configure BGP on SONiC switches — block/rescue style
  hosts: sonic_switches
  gather_facts: false
  serial: 1

  tasks:

    # ── 1. BGP CONFIGURATION ────────────────────────────
    - name: Remove existing BGP instance if present
      ansible.builtin.shell: |
        sudo vtysh -c "configure terminal" \
                   -c "no router bgp {{ bgp_asn }}" \
                   -c "end" \
                   -c "write memory"
      changed_when: true
      ignore_errors: true

    - name: Configure BGP router-id, neighbors and networks
      block:
        - name: Configure BGP router-id and policy
          ansible.builtin.shell: |
            sudo vtysh -c "configure terminal" \
                       -c "router bgp {{ bgp_asn }}" \
                       -c "bgp router-id {{ bgp_router_id }}" \
                       -c "no bgp ebgp-requires-policy" \
                       -c "end" \
                       -c "write memory"
          changed_when: true

        - name: Add BGP neighbor {{ item.peer_ip }} remote-as {{ item.remote_as }}
          ansible.builtin.shell: |
            sudo vtysh -c "configure terminal" \
                       -c "router bgp {{ bgp_asn }}" \
                       -c "neighbor {{ item.peer_ip }} remote-as {{ item.remote_as }}" \
                       -c "end" \
                       -c "write memory"
          loop: "{{ bgp_neighbors }}"
          changed_when: true

        - name: Advertise network {{ item }} into BGP
          ansible.builtin.shell: |
            sudo vtysh -c "configure terminal" \
                       -c "router bgp {{ bgp_asn }}" \
                       -c "address-family ipv4 unicast" \
                       -c "network {{ item }}" \
                       -c "exit" \
                       -c "end" \
                       -c "write memory"
          loop: "{{ bgp_networks }}"
          when: bgp_networks | length > 0
          changed_when: true

      rescue:
        - name: BGP configuration failed — printing error
          ansible.builtin.debug:
            msg: "BGP config block failed on {{ inventory_hostname }}, check vtysh manually"

    # ── 2. WAIT FOR BGP TO ESTABLISH ────────────────────
    - name: Wait 15 seconds for BGP to establish
      ansible.builtin.pause:
        seconds: 15

    # ── 3. VERIFY ───────────────────────────────────────
    - name: Collect verification output
      ansible.builtin.shell: "{{ item.cmd }}"
      loop:
        - { cmd: "sudo vtysh -c 'show ip bgp summary'",   label: "BGP summary" }
        - { cmd: "sudo vtysh -c 'show ip bgp neighbors'", label: "BGP neighbors" }
        - { cmd: "ip route",                              label: "IP route" }
      register: verify_out
      changed_when: false

    - name: Print verification for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg:
          - "━━━ {{ inventory_hostname }} ━━━"
          - "── {{ item.item.label }} ──"
          - "{{ item.stdout }}"
      loop: "{{ verify_out.results }}"
