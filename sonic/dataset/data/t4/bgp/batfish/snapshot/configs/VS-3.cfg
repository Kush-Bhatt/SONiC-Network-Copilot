frr version 10.5.1
frr defaults traditional
hostname VS-3
!
interface Loopback0
 ip address 10.1.0.1/32
!
interface eth1
 ip address 10.0.13.2/30
!
interface eth2
 ip address 10.0.23.2/30
!
interface eth3
 ip address 192.168.200.2/24
!
router bgp 65003
 bgp router-id 10.0.23.2
 no bgp ebgp-requires-policy
 neighbor 10.0.23.1 remote-as 65002
 !
 address-family ipv4 unicast
  network 10.0.23.0/30
  network 192.168.200.0/24
 exit-address-family
!
end
