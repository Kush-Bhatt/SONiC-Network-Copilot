---
- name: Clear stale SSH host keys from controller
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove stale known_hosts entry for each switch
      ansible.builtin.shell: |
        ssh-keygen -f "/home/SONICtestbed/.ssh/known_hosts" -R "{{ item }}" 2>/dev/null || true
      loop:
        - 192.168.100.2
        - 192.168.100.3
        - 192.168.100.4
      changed_when: false

- name: Validate all switch variables before touching anything
  hosts: sonic_switches
  gather_facts: false
  serial: 1
  tasks:

    - name: Assert required variables are defined
      ansible.builtin.assert:
        that:
          - portchannels is defined
          - portchannels | length > 0
          - loopback is defined
          - loopback.name is defined
          - loopback.ip is defined
          - static_routes is defined
          - static_routes | length > 0
          - interfaces_to_clean is defined
          - vlans is defined or vlan is defined or routed_interfaces is defined
        fail_msg: "{{ inventory_hostname }} is missing required variables — aborting"
        success_msg: "{{ inventory_hostname }} variables validated OK"

    - name: Assert each portchannel has name, ip and member
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.ip is defined
          - item.member is defined
        fail_msg: "PortChannel entry missing fields on {{ inventory_hostname }}"
      loop: "{{ portchannels }}"

    - name: Assert each static route has prefix and nexthop
      ansible.builtin.assert:
        that:
          - item.prefix is defined
          - item.nexthop is defined
        fail_msg: "Static route missing prefix or nexthop on {{ inventory_hostname }}"
      loop: "{{ static_routes }}"

    - name: Assert VLAN has id, ip and members if defined
      ansible.builtin.assert:
        that:
          - vlan.id is defined
          - vlan.ip is defined
          - vlan.members is defined
          - vlan.members | length > 0
        fail_msg: "VLAN entry missing fields on {{ inventory_hostname }}"
      when: vlan is defined

    - name: Assert each routed interface has name and ip if defined
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.ip is defined
        fail_msg: "Routed interface missing name or ip on {{ inventory_hostname }}"
      loop: "{{ routed_interfaces }}"
      when: routed_interfaces is defined

    - name: Build config summary fact
      ansible.builtin.set_fact:
        switch_summary:
          host: "{{ inventory_hostname }}"
          portchannel_count: "{{ portchannels | length }}"
          loopback: "{{ loopback.name }} — {{ loopback.ip }}"
          has_vlan: "{{ vlan is defined }}"
          vlan_id: "{{ vlan.id | default('none') }}"
          has_routed_interfaces: "{{ routed_interfaces is defined }}"
          static_route_count: "{{ static_routes | length }}"

    - name: Print config summary before pushing
      ansible.builtin.debug:
        var: switch_summary

- name: Configure all SONiC switches — validate-first style
  hosts: sonic_switches
  gather_facts: false
  serial: 1

  tasks:

    # ── 0. PRE-CLEAN ────────────────────────────────────
    - name: Clean bare INTERFACE entries from CONFIG_DB
      ansible.builtin.shell: |
        for key in $(sonic-db-cli CONFIG_DB keys "INTERFACE|{{ item }}|*" 2>/dev/null); do
          ip=$(echo "$key" | awk -F'|' '{print $3}')
          sudo config interface ip remove {{ item }} "$ip" 2>/dev/null || true
        done
        exists=$(sonic-db-cli CONFIG_DB exists "INTERFACE|{{ item }}" 2>/dev/null || echo "0")
        if [ "$exists" = "1" ]; then
          sonic-db-cli CONFIG_DB del "INTERFACE|{{ item }}"
          echo changed
        else
          echo ok
        fi
      register: clean_iface
      changed_when: "'changed' in clean_iface.stdout"
      loop: "{{ interfaces_to_clean }}"

    # ── 1. PORTCHANNELS ─────────────────────────────────
    - name: Create PortChannels
      ansible.builtin.raw: "sudo config portchannel add {{ item.name }}"
      loop: "{{ portchannels }}"
      loop_control:
        label: "{{ item.name }}"
      ignore_errors: true

    - name: Add PortChannel members
      ansible.builtin.raw: "sudo config portchannel member add {{ item.name }} {{ item.member }}"
      loop: "{{ portchannels }}"
      loop_control:
        label: "{{ item.member }} -> {{ item.name }}"
      ignore_errors: true

    - name: Assign IPs to PortChannels
      ansible.builtin.raw: "sudo config interface ip add {{ item.name }} {{ item.ip }}"
      loop: "{{ portchannels }}"
      loop_control:
        label: "{{ item.name }} {{ item.ip }}"
      ignore_errors: true

    # ── 2. LOOPBACK ─────────────────────────────────────
    - name: Create loopback interface
      ansible.builtin.raw: "sudo config loopback add {{ loopback.name }}"
      ignore_errors: true

    - name: Assign loopback IP
      ansible.builtin.raw: "sudo config interface ip add {{ loopback.name }} {{ loopback.ip }}"
      ignore_errors: true

    # ── 3. VLAN — VS-1 and VS-2 only ───────────────────
    - name: Create VLAN
      ansible.builtin.raw: "sudo config vlan add {{ vlan.id }}"
      when: vlan is defined
      ignore_errors: true

    - name: Add VLAN member ports untagged
      ansible.builtin.raw: "sudo config vlan member add {{ vlan.id }} {{ item.port }} --untagged"
      loop: "{{ vlan.members }}"
      loop_control:
        label: "{{ item.port }}"
      when: vlan is defined
      ignore_errors: true

    - name: Set MTU 1500 on VLAN member ports
      ansible.builtin.raw: "sudo config interface mtu {{ item.port }} 1500"
      loop: "{{ vlan.members }}"
      loop_control:
        label: "{{ item.port }}"
      when: vlan is defined
      ignore_errors: true

    - name: Add Vlan SVI IP
      ansible.builtin.raw: "sudo config interface ip add Vlan{{ vlan.id }} {{ vlan.ip }}"
      when: vlan is defined
      ignore_errors: true

    # ── 4. ROUTED INTERFACES — VS-3 only ───────────────
    - name: Configure routed interfaces
      ansible.builtin.raw: "sudo config interface ip add {{ item.name }} {{ item.ip }}"
      loop: "{{ routed_interfaces }}"
      loop_control:
        label: "{{ item.name }} {{ item.ip }}"
      when: routed_interfaces is defined
      ignore_errors: true

    - name: Set MTU 1500 on routed interfaces
      ansible.builtin.raw: "sudo config interface mtu {{ item.name }} 1500"
      loop: "{{ routed_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      when: routed_interfaces is defined
      ignore_errors: true

    # ── 5. STATIC ROUTES ────────────────────────────────
    - name: Configure static routes
      ansible.builtin.raw: "sudo config route add prefix {{ item.prefix }} nexthop {{ item.nexthop }}"
      loop: "{{ static_routes }}"
      loop_control:
        label: "{{ item.prefix }} via {{ item.nexthop }}"
      ignore_errors: true

    # ── 6. DISABLE rp_filter ────────────────────────────
    - name: Disable rp_filter on all interfaces
      ansible.builtin.shell: |
        echo 0 > /proc/sys/net/ipv4/conf/all/rp_filter
        echo 0 > /proc/sys/net/ipv4/conf/default/rp_filter
        for iface in $(ls /proc/sys/net/ipv4/conf/); do
          echo 0 > /proc/sys/net/ipv4/conf/$iface/rp_filter 2>/dev/null || true
        done
      changed_when: true

    - name: Persist rp_filter disable across reboots
      ansible.builtin.shell: |
        grep -q "net.ipv4.conf.all.rp_filter" /etc/sysctl.conf 2>/dev/null && \
          sed -i 's/net.ipv4.conf.all.rp_filter.*/net.ipv4.conf.all.rp_filter = 0/' /etc/sysctl.conf || \
          echo "net.ipv4.conf.all.rp_filter = 0" >> /etc/sysctl.conf
        grep -q "net.ipv4.conf.default.rp_filter" /etc/sysctl.conf 2>/dev/null && \
          sed -i 's/net.ipv4.conf.default.rp_filter.*/net.ipv4.conf.default.rp_filter = 0/' /etc/sysctl.conf || \
          echo "net.ipv4.conf.default.rp_filter = 0" >> /etc/sysctl.conf
      changed_when: true

    # ── 7. SAVE ─────────────────────────────────────────
    - name: Save configuration
      ansible.builtin.raw: "sudo config save -y"

    # ── 8. VERIFY ───────────────────────────────────────
    - name: Collect and register all verification output
      ansible.builtin.raw: "{{ item.cmd }}"
      loop:
        - { cmd: "show ip interfaces",                        label: "IP interfaces" }
        - { cmd: "show ip route",                             label: "IP routes" }
        - { cmd: "show vlan brief",                           label: "VLAN brief" }
        - { cmd: "show interface portchannel",                label: "PortChannels" }
        - { cmd: "sudo vtysh -c 'show running-config'",       label: "FRR config" }
        - { cmd: "cat /proc/sys/net/ipv4/conf/all/rp_filter", label: "rp_filter" }
      register: verify_out
      changed_when: false

    - name: Print all verification results for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg:
          - "━━━ {{ inventory_hostname }} ━━━"
          - "── {{ item.item.label }} ──"
          - "{{ item.stdout }}"
      loop: "{{ verify_out.results }}"
