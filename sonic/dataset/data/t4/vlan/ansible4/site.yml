---
- name: Clear stale SSH host keys from controller
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove stale known_hosts entry for each switch
      ansible.builtin.shell: |
        ssh-keygen -f "/home/SONICtestbed/.ssh/known_hosts" -R "{{ item }}" 2>/dev/null || true
      loop:
        - 192.168.100.2
        - 192.168.100.3
        - 192.168.100.4
      changed_when: false

- name: Configure all SONiC switches — register/when chaining style
  hosts: sonic_switches
  gather_facts: false
  serial: 1

  tasks:

    # ── 0. PRE-CLEAN ────────────────────────────────────
    - name: Check which interfaces need cleaning
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "INTERFACE|{{ item }}" 2>/dev/null || echo "0"
      loop: "{{ interfaces_to_clean }}"
      loop_control:
        label: "{{ item }}"
      register: iface_check
      changed_when: false

    - name: Clean dirty interfaces
      ansible.builtin.shell: |
        for key in $(sonic-db-cli CONFIG_DB keys "INTERFACE|{{ item.item }}|*" 2>/dev/null); do
          ip=$(echo "$key" | awk -F'|' '{print $3}')
          sudo config interface ip remove {{ item.item }} "$ip" 2>/dev/null || true
        done
        sonic-db-cli CONFIG_DB del "INTERFACE|{{ item.item }}"
      loop: "{{ iface_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout == "1"
      changed_when: true

    # ── 1. PORTCHANNELS ─────────────────────────────────
    - name: Check which PortChannels are missing
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "PORTCHANNEL|{{ item.name }}" 2>/dev/null || echo "0"
      loop: "{{ portchannels }}"
      loop_control:
        label: "{{ item.name }}"
      register: pc_check
      changed_when: false

    - name: Create missing PortChannels
      ansible.builtin.raw: "sudo config portchannel add {{ item.item.name }}"
      loop: "{{ pc_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout == "0"
      changed_when: true

    - name: Check which PortChannel members are missing
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "PORTCHANNEL_MEMBER|{{ item.name }}|{{ item.member }}" 2>/dev/null || echo "0"
      loop: "{{ portchannels }}"
      loop_control:
        label: "{{ item.member }} -> {{ item.name }}"
      register: pc_member_check
      changed_when: false

    - name: Add missing PortChannel members
      ansible.builtin.raw: "sudo config portchannel member add {{ item.item.name }} {{ item.item.member }}"
      loop: "{{ pc_member_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout == "0"
      changed_when: true

    - name: Check which PortChannel IPs are missing
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "PORTCHANNEL_INTERFACE|{{ item.name }}|{{ item.ip }}" 2>/dev/null || echo "0"
      loop: "{{ portchannels }}"
      loop_control:
        label: "{{ item.name }} {{ item.ip }}"
      register: pc_ip_check
      changed_when: false

    - name: Assign missing PortChannel IPs
      ansible.builtin.raw: "sudo config interface ip add {{ item.item.name }} {{ item.item.ip }}"
      loop: "{{ pc_ip_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout == "0"
      changed_when: true

    # ── 2. LOOPBACK ─────────────────────────────────────
    - name: Check if loopback exists
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "LOOPBACK_INTERFACE|{{ loopback.name }}" 2>/dev/null || echo "0"
      register: lo_check
      changed_when: false

    - name: Create missing loopback
      ansible.builtin.raw: "sudo config loopback add {{ loopback.name }}"
      when: lo_check.stdout == "0"
      changed_when: true

    - name: Check if loopback IP is missing
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "LOOPBACK_INTERFACE|{{ loopback.name }}|{{ loopback.ip }}" 2>/dev/null || echo "0"
      register: lo_ip_check
      changed_when: false

    - name: Assign missing loopback IP
      ansible.builtin.raw: "sudo config interface ip add {{ loopback.name }} {{ loopback.ip }}"
      when: lo_ip_check.stdout == "0"
      changed_when: true

    # ── 3. VLAN — VS-1 and VS-2 only ───────────────────
    - name: Check if VLAN exists
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "VLAN|Vlan{{ vlan.id }}" 2>/dev/null || echo "0"
      register: vlan_check
      changed_when: false
      when: vlan is defined

    - name: Create missing VLAN
      ansible.builtin.raw: "sudo config vlan add {{ vlan.id }}"
      when:
        - vlan is defined
        - vlan_check.stdout == "0"
      changed_when: true

    - name: Check which VLAN members are missing
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "VLAN_MEMBER|Vlan{{ vlan.id }}|{{ item.port }}" 2>/dev/null || echo "0"
      loop: "{{ vlan.members }}"
      loop_control:
        label: "{{ item.port }}"
      register: vlan_member_check
      changed_when: false
      when: vlan is defined

    - name: Add missing VLAN member ports untagged
      ansible.builtin.raw: "sudo config vlan member add {{ vlan.id }} {{ item.item.port }} --untagged"
      loop: "{{ vlan_member_check.results }}"
      loop_control:
        label: "{{ item.item.port }}"
      when:
        - vlan is defined
        - item.stdout == "0"
      changed_when: true

    - name: Set MTU 1500 on VLAN member ports
      ansible.builtin.raw: "sudo config interface mtu {{ item.item.port }} 1500"
      loop: "{{ vlan_member_check.results }}"
      loop_control:
        label: "{{ item.item.port }}"
      when:
        - vlan is defined
        - item.stdout == "0"
      changed_when: true

    - name: Check if VLAN SVI IP is missing
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "VLAN_INTERFACE|Vlan{{ vlan.id }}|{{ vlan.ip }}" 2>/dev/null || echo "0"
      register: vlan_ip_check
      changed_when: false
      when: vlan is defined

    - name: Assign missing VLAN SVI IP
      ansible.builtin.raw: "sudo config interface ip add Vlan{{ vlan.id }} {{ vlan.ip }}"
      when:
        - vlan is defined
        - vlan_ip_check.stdout == "0"
      changed_when: true

    # ── 4. ROUTED INTERFACES — VS-3 only ───────────────
    - name: Check which routed interface IPs are missing
      ansible.builtin.shell: |
        sonic-db-cli CONFIG_DB exists "INTERFACE|{{ item.name }}|{{ item.ip }}" 2>/dev/null || echo "0"
      loop: "{{ routed_interfaces }}"
      loop_control:
        label: "{{ item.name }}"
      register: routed_check
      changed_when: false
      when: routed_interfaces is defined

    - name: Assign missing routed interface IPs
      ansible.builtin.raw: "sudo config interface ip add {{ item.item.name }} {{ item.item.ip }}"
      loop: "{{ routed_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - routed_interfaces is defined
        - item.stdout == "0"
      changed_when: true

    - name: Set MTU 1500 on routed interfaces
      ansible.builtin.raw: "sudo config interface mtu {{ item.item.name }} 1500"
      loop: "{{ routed_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - routed_interfaces is defined
        - item.stdout == "0"
      changed_when: true

    # ── 5. STATIC ROUTES ────────────────────────────────
    - name: Check which static routes are missing
      ansible.builtin.shell: |
        sudo vtysh -c "show running-config" 2>/dev/null \
          | grep -c "^ip route {{ item.prefix }} {{ item.nexthop }}" || true
      loop: "{{ static_routes }}"
      loop_control:
        label: "{{ item.prefix }} via {{ item.nexthop }}"
      register: route_check
      changed_when: false

    - name: Add missing static routes
      ansible.builtin.raw: "sudo config route add prefix {{ item.item.prefix }} nexthop {{ item.item.nexthop }}"
      loop: "{{ route_check.results }}"
      loop_control:
        label: "{{ item.item.prefix }}"
      when: item.stdout == "0"
      changed_when: true

    # ── 6. DISABLE rp_filter ────────────────────────────
    - name: Check current rp_filter value
      ansible.builtin.shell: cat /proc/sys/net/ipv4/conf/all/rp_filter
      register: rp_check
      changed_when: false

    - name: Disable rp_filter on all interfaces
      ansible.builtin.shell: |
        echo 0 > /proc/sys/net/ipv4/conf/all/rp_filter
        echo 0 > /proc/sys/net/ipv4/conf/default/rp_filter
        for iface in $(ls /proc/sys/net/ipv4/conf/); do
          echo 0 > /proc/sys/net/ipv4/conf/$iface/rp_filter 2>/dev/null || true
        done
      when: rp_check.stdout != "0"
      changed_when: true

    - name: Persist rp_filter disable across reboots
      ansible.builtin.shell: |
        grep -q "net.ipv4.conf.all.rp_filter" /etc/sysctl.conf 2>/dev/null && \
          sed -i 's/net.ipv4.conf.all.rp_filter.*/net.ipv4.conf.all.rp_filter = 0/' /etc/sysctl.conf || \
          echo "net.ipv4.conf.all.rp_filter = 0" >> /etc/sysctl.conf
        grep -q "net.ipv4.conf.default.rp_filter" /etc/sysctl.conf 2>/dev/null && \
          sed -i 's/net.ipv4.conf.default.rp_filter.*/net.ipv4.conf.default.rp_filter = 0/' /etc/sysctl.conf || \
          echo "net.ipv4.conf.default.rp_filter = 0" >> /etc/sysctl.conf
      when: rp_check.stdout != "0"
      changed_when: true

    # ── 7. SAVE ─────────────────────────────────────────
    - name: Save configuration
      ansible.builtin.raw: "sudo config save -y"
      changed_when: true

    # ── 8. VERIFY ───────────────────────────────────────
    - name: Collect verification output
      ansible.builtin.raw: "{{ item.cmd }}"
      loop:
        - { cmd: "show ip interfaces",                        label: "IP interfaces" }
        - { cmd: "show ip route",                             label: "IP routes" }
        - { cmd: "show vlan brief",                           label: "VLAN brief" }
        - { cmd: "show interface portchannel",                label: "PortChannels" }
        - { cmd: "sudo vtysh -c 'show running-config'",       label: "FRR config" }
        - { cmd: "cat /proc/sys/net/ipv4/conf/all/rp_filter", label: "rp_filter" }
      register: verify_out
      changed_when: false

    - name: Print verification for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg:
          - "━━━ {{ inventory_hostname }} ━━━"
          - "── {{ item.item.label }} ──"
          - "{{ item.stdout }}"
      loop: "{{ verify_out.results }}"
