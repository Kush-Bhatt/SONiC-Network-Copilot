---
- name: Clear stale SSH host keys from controller
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove stale known_hosts entry for each switch
      ansible.builtin.shell: |
        ssh-keygen -f "/home/SONICtestbed/.ssh/known_hosts" -R "{{ item }}" 2>/dev/null || true
      loop:
        - 192.168.100.2
        - 192.168.100.3
        - 192.168.100.4
      changed_when: false

- name: Validate all switch variables before touching anything
  hosts: sonic_switches
  gather_facts: false
  serial: 1
  tasks:

    - name: Assert required variables are defined and non-empty
      ansible.builtin.assert:
        that:
          - loopbacks is defined
          - loopbacks | length > 0
          - interfaces is defined
          - interfaces | length > 0
          - portchannels is defined
          - portchannels | length > 0
          - static_routes is defined
          - frr_default_routes is defined
          - iptables_forward_rules is defined
        fail_msg: "{{ inventory_hostname }} is missing required variables — aborting"
        success_msg: "{{ inventory_hostname }} variables validated OK"

    - name: Assert each interface has name and ip
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.ip is defined
        fail_msg: "Interface entry missing name or ip on {{ inventory_hostname }}"
      loop: "{{ interfaces }}"

    - name: Assert each portchannel has name, ip, min_links, members
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.ip is defined
          - item.min_links is defined
          - item.members is defined
          - item.members | length > 0
        fail_msg: "PortChannel entry missing fields on {{ inventory_hostname }}"
      loop: "{{ portchannels }}"

    - name: Assert each static route has prefix and nexthop
      ansible.builtin.assert:
        that:
          - item.prefix is defined
          - item.nexthop is defined
        fail_msg: "Static route missing prefix or nexthop on {{ inventory_hostname }}"
      loop: "{{ static_routes }}"

    - name: Assert each iptables rule has src, dst, action, comment
      ansible.builtin.assert:
        that:
          - item.src is defined
          - item.dst is defined
          - item.action is defined
          - item.comment is defined
        fail_msg: "iptables rule missing fields on {{ inventory_hostname }}"
      loop: "{{ iptables_forward_rules }}"
      when: iptables_forward_rules | length > 0

    - name: Build flat config summary as fact
      ansible.builtin.set_fact:
        switch_summary:
          host: "{{ inventory_hostname }}"
          loopback_count: "{{ loopbacks | length }}"
          interface_count: "{{ interfaces | length }}"
          portchannel_count: "{{ portchannels | length }}"
          vlan_count: "{{ vlans | length }}"
          static_route_count: "{{ static_routes | length }}"
          frr_route_count: "{{ frr_default_routes | length }}"
          iptables_rule_count: "{{ iptables_forward_rules | length }}"

    - name: Print config summary before pushing
      ansible.builtin.debug:
        var: switch_summary

- name: Full config push — validate-first style
  hosts: sonic_switches
  gather_facts: false
  serial: 1

  tasks:

    # ── 0. PRE-CLEAN ────────────────────────────────────
    - name: Clean bare INTERFACE entries before config
      ansible.builtin.shell: |
        for key in $(sonic-db-cli CONFIG_DB keys "INTERFACE|{{ item }}|*" 2>/dev/null); do
          ip=$(echo "$key" | awk -F'|' '{print $3}')
          sudo config interface ip remove {{ item }} "$ip" 2>/dev/null || true
        done
        exists=$(sonic-db-cli CONFIG_DB exists "INTERFACE|{{ item }}" 2>/dev/null || echo "0")
        if [ "$exists" = "1" ]; then
          sonic-db-cli CONFIG_DB del "INTERFACE|{{ item }}"
          echo changed
        else
          echo ok
        fi
      register: clean_iface
      changed_when: "'changed' in clean_iface.stdout"
      loop: "{{ interfaces_to_clean | default([]) }}"

    # ── 1. LOOPBACKS ────────────────────────────────────
    - name: Create loopback interface
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "LOOPBACK_INTERFACE|{{ item.name }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config loopback add {{ item.name }} && echo changed; else echo ok; fi
      loop: "{{ loopbacks }}"
      register: r
      changed_when: "'changed' in r.stdout"

    - name: Assign loopback IP
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "LOOPBACK_INTERFACE|{{ item.name }}|{{ item.ip }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config interface ip add {{ item.name }} {{ item.ip }} && echo changed; else echo ok; fi
      loop: "{{ loopbacks }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 2. PORTCHANNELS ─────────────────────────────────
    - name: Create PortChannel
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "PORTCHANNEL|{{ item.name }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config portchannel add {{ item.name }} --min-links {{ item.min_links }} && echo changed; else echo ok; fi
      loop: "{{ portchannels }}"
      register: r
      changed_when: "'changed' in r.stdout"

    - name: Add PortChannel members
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "PORTCHANNEL_MEMBER|{{ item.0.name }}|{{ item.1 }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config portchannel member add {{ item.0.name }} {{ item.1 }} && echo changed; else echo ok; fi
      loop: "{{ portchannels | subelements('members') }}"
      register: r
      changed_when: "'changed' in r.stdout"

    - name: Assign PortChannel IP
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "PORTCHANNEL_INTERFACE|{{ item.name }}|{{ item.ip }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config interface ip add {{ item.name }} {{ item.ip }} && echo changed; else echo ok; fi
      loop: "{{ portchannels }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 3. ROUTED INTERFACES ────────────────────────────
    - name: Assign interface IP
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "INTERFACE|{{ item.name }}|{{ item.ip }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config interface ip add {{ item.name }} {{ item.ip }} && echo changed; else echo ok; fi
      loop: "{{ interfaces }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 4. VLANs ────────────────────────────────────────
    - name: Create VLAN
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "VLAN|Vlan{{ item.id }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config vlan add {{ item.id }} && echo changed; else echo ok; fi
      loop: "{{ vlans }}"
      register: r
      changed_when: "'changed' in r.stdout"
      when: vlans | length > 0

    - name: Assign VLAN IP
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "VLAN_INTERFACE|Vlan{{ item.id }}|{{ item.ip }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config interface ip add Vlan{{ item.id }} {{ item.ip }} && echo changed; else echo ok; fi
      loop: "{{ vlans }}"
      register: r
      changed_when: "'changed' in r.stdout"
      when: vlans | length > 0

    - name: Add VLAN member ports
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "VLAN_MEMBER|Vlan{{ item.0.id }}|{{ item.1.port }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config vlan member add {{ item.0.id }} {{ item.1.port }} {% if item.1.mode == 'untagged' %}--untagged{% endif %} && echo changed; else echo ok; fi
      loop: "{{ vlans | subelements('members') }}"
      register: r
      changed_when: "'changed' in r.stdout"
      when: vlans | length > 0

    # ── 5. STATIC ROUTES ────────────────────────────────
    - name: Add static route
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "STATIC_ROUTE|{{ item.vrf }}|{{ item.prefix }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then sudo config route add prefix {{ item.prefix }} nexthop {{ item.nexthop }} && echo changed; else echo ok; fi
      loop: "{{ static_routes }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 6. FRR ROUTES ───────────────────────────────────
    - name: Add FRR route
      ansible.builtin.shell: |
        existing=$(sudo vtysh -c "show running-config" 2>/dev/null | grep -c "^ip route {{ item.prefix }} {{ item.nexthop }}" || true)
        if [ "$existing" = "0" ]; then
          sudo vtysh -c "configure terminal" -c "ip route {{ item.prefix }} {{ item.nexthop }}" -c "end" -c "write memory" && echo changed
        else echo ok; fi
      loop: "{{ frr_default_routes }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 7. SAVE ─────────────────────────────────────────
    - name: Save SONiC config
      ansible.builtin.shell: sudo config save -y
      changed_when: true

    # ── 8. IPTABLES ─────────────────────────────────────
    - name: Flush and reapply FORWARD rules
      when: iptables_forward_rules | length > 0
      block:
        - name: Check for duplicate FORWARD rules by comment
          ansible.builtin.shell: |
            count=$(sudo iptables -L FORWARD --line-numbers -n | grep -c "{{ item.comment }}" || true)
            if [ "$count" -gt "1" ]; then
              sudo iptables -F FORWARD
              echo flushed
            else
              echo ok
            fi
          loop: "{{ iptables_forward_rules }}"
          register: flush_r
          changed_when: "'flushed' in flush_r.stdout"

        - name: Apply FORWARD rule with state — {{ item.comment }}
          ansible.builtin.shell: |
            if ! sudo iptables -C FORWARD -s {{ item.src }} -d {{ item.dst }} \
              -m state --state {{ item.state }} -j {{ item.action }} 2>/dev/null; then
              sudo iptables -A FORWARD -s {{ item.src }} -d {{ item.dst }} \
                -m state --state {{ item.state }} -j {{ item.action }} \
                -m comment --comment "{{ item.comment }}"
              echo changed
            else
              echo ok
            fi
          loop: "{{ iptables_forward_rules }}"
          when: item.state is defined
          register: r
          changed_when: "'changed' in r.stdout"

        - name: Apply FORWARD rule without state — {{ item.comment }}
          ansible.builtin.shell: |
            if ! sudo iptables -C FORWARD -s {{ item.src }} -d {{ item.dst }} \
              -j {{ item.action }} 2>/dev/null; then
              sudo iptables -A FORWARD -s {{ item.src }} -d {{ item.dst }} \
                -j {{ item.action }} \
                -m comment --comment "{{ item.comment }}"
              echo changed
            else
              echo ok
            fi
          loop: "{{ iptables_forward_rules }}"
          when: item.state is not defined
          register: r
          changed_when: "'changed' in r.stdout"

        - name: Persist iptables rules
          ansible.builtin.shell: sudo sh -c 'iptables-save > /etc/iptables/rules.v4'
          changed_when: true

      rescue:
        - name: iptables apply failed — printing error
          ansible.builtin.debug:
            msg: "iptables block failed on {{ inventory_hostname }}"

    # ── 9. VERIFY ───────────────────────────────────────
    - name: Collect and register all verification output
      ansible.builtin.shell: "{{ item.cmd }}"
      loop:
        - { cmd: "show ip interfaces",                         label: "IP interfaces" }
        - { cmd: "show ip route",                              label: "IP routes" }
        - { cmd: "sudo vtysh -c 'show running-config'",        label: "FRR config" }
        - { cmd: "sudo iptables -L FORWARD -n --line-numbers", label: "iptables FORWARD" }
      register: verify_out
      changed_when: false

    - name: Print all verification results for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg:
          - "━━━ {{ inventory_hostname }} ━━━"
          - "── {{ item.item.label }} ──"
          - "{{ item.stdout }}"
      loop: "{{ verify_out.results }}"
