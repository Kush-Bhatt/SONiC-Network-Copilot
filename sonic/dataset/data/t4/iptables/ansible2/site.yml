---
- name: Clear stale SSH host keys from controller
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove stale known_hosts entry for each switch
      ansible.builtin.shell: |
        ssh-keygen -f "/home/SONICtestbed/.ssh/known_hosts" -R "{{ item }}" 2>/dev/null || true
      loop:
        - 192.168.100.2
        - 192.168.100.3
        - 192.168.100.4
      changed_when: false

- name: Full config push — block/rescue style
  hosts: sonic_switches
  gather_facts: false
  serial: 1

  tasks:

    # ── 0. PRE-CLEAN ────────────────────────────────────
    - name: Pre-clean bare INTERFACE entries
      block:
        - name: Remove IP entries for {{ item }}
          ansible.builtin.shell: |
            for key in $(sonic-db-cli CONFIG_DB keys "INTERFACE|{{ item }}|*" 2>/dev/null); do
              ip=$(echo "$key" | awk -F'|' '{print $3}')
              sudo config interface ip remove {{ item }} "$ip" 2>/dev/null || true
            done
            sonic-db-cli CONFIG_DB del "INTERFACE|{{ item }}" 2>/dev/null || true
          loop: "{{ interfaces_to_clean }}"
          changed_when: true
      rescue:
        - name: Pre-clean failed — continuing anyway
          ansible.builtin.debug:
            msg: "Pre-clean on {{ inventory_hostname }} had errors, continuing"

    # ── 1. LOOPBACKS ────────────────────────────────────
    - name: Configure loopbacks
      block:
        - name: Create loopback {{ item.name }}
          ansible.builtin.shell: sudo config loopback add {{ item.name }}
          loop: "{{ loopbacks }}"
          changed_when: true
      rescue:
        - name: Loopback already exists — assign IP anyway
          ansible.builtin.shell: |
            sudo config interface ip add {{ item.name }} {{ item.ip }} 2>/dev/null || true
          loop: "{{ loopbacks }}"
          changed_when: true

    - name: Assign loopback IPs
      block:
        - name: Add IP {{ item.ip }} to {{ item.name }}
          ansible.builtin.shell: sudo config interface ip add {{ item.name }} {{ item.ip }}
          loop: "{{ loopbacks }}"
          changed_when: true
      rescue:
        - name: Loopback IP already assigned — skipping
          ansible.builtin.debug:
            msg: "IP already exists on loopback, continuing"

    # ── 2. PORTCHANNELS ─────────────────────────────────
    - name: Create PortChannels
      block:
        - name: Create {{ item.name }}
          ansible.builtin.shell: sudo config portchannel add {{ item.name }} --min-links {{ item.min_links }}
          loop: "{{ portchannels }}"
          changed_when: true
      rescue:
        - name: PortChannel already exists — continuing
          ansible.builtin.debug:
            msg: "PortChannel already exists, continuing"

    - name: Add PortChannel members
      block:
        - name: Add member {{ item.1 }} to {{ item.0.name }}
          ansible.builtin.shell: sudo config portchannel member add {{ item.0.name }} {{ item.1 }}
          loop: "{{ portchannels | subelements('members') }}"
          changed_when: true
      rescue:
        - name: Member already exists — continuing
          ansible.builtin.debug:
            msg: "PortChannel member already exists, continuing"

    - name: Assign PortChannel IPs
      block:
        - name: Add IP {{ item.ip }} to {{ item.name }}
          ansible.builtin.shell: sudo config interface ip add {{ item.name }} {{ item.ip }}
          loop: "{{ portchannels }}"
          changed_when: true
      rescue:
        - name: PortChannel IP already assigned — continuing
          ansible.builtin.debug:
            msg: "PortChannel IP already exists, continuing"

    # ── 3. ROUTED INTERFACES ────────────────────────────
    - name: Assign routed interface IPs
      block:
        - name: Add IP {{ item.ip }} to {{ item.name }}
          ansible.builtin.shell: sudo config interface ip add {{ item.name }} {{ item.ip }}
          loop: "{{ interfaces }}"
          changed_when: true
      rescue:
        - name: Interface IP already assigned — continuing
          ansible.builtin.debug:
            msg: "Interface IP already exists, continuing"

    # ── 4. VLANs ────────────────────────────────────────
    - name: Configure VLANs
      when: vlans | length > 0
      block:
        - name: Create Vlan{{ item.id }}
          ansible.builtin.shell: sudo config vlan add {{ item.id }}
          loop: "{{ vlans }}"
          changed_when: true
      rescue:
        - name: VLAN already exists — continuing
          ansible.builtin.debug:
            msg: "VLAN already exists, continuing"

    - name: Assign VLAN IPs
      when: vlans | length > 0
      block:
        - name: Add IP {{ item.ip }} to Vlan{{ item.id }}
          ansible.builtin.shell: sudo config interface ip add Vlan{{ item.id }} {{ item.ip }}
          loop: "{{ vlans }}"
          changed_when: true
      rescue:
        - name: VLAN IP already assigned — continuing
          ansible.builtin.debug:
            msg: "VLAN IP already exists, continuing"

    - name: Add VLAN member ports
      when: vlans | length > 0
      block:
        - name: Add {{ item.1.port }} to Vlan{{ item.0.id }}
          ansible.builtin.shell: |
            sudo config vlan member add {{ item.0.id }} {{ item.1.port }} {% if item.1.mode == 'untagged' %}--untagged{% endif %}
          loop: "{{ vlans | subelements('members') }}"
          changed_when: true
      rescue:
        - name: VLAN member already exists — continuing
          ansible.builtin.debug:
            msg: "VLAN member already exists, continuing"

    # ── 5. STATIC ROUTES ────────────────────────────────
    - name: Add static routes
      block:
        - name: Add route {{ item.prefix }} via {{ item.nexthop }}
          ansible.builtin.shell: sudo config route add prefix {{ item.prefix }} nexthop {{ item.nexthop }}
          loop: "{{ static_routes }}"
          changed_when: true
      rescue:
        - name: Static route already exists — continuing
          ansible.builtin.debug:
            msg: "Static route already exists, continuing"

    # ── 6. FRR ROUTES ───────────────────────────────────
    - name: Add FRR routes via vtysh
      ansible.builtin.shell: |
        sudo vtysh -c "configure terminal" \
                   -c "ip route {{ item.prefix }} {{ item.nexthop }}" \
                   -c "end" \
                   -c "write memory"
      loop: "{{ frr_default_routes }}"
      changed_when: true
      ignore_errors: true

    # ── 7. SAVE ─────────────────────────────────────────
    - name: Save SONiC config
      ansible.builtin.shell: sudo config save -y
      changed_when: true

    # ── 8. IPTABLES ─────────────────────────────────────
    - name: Flush and reapply FORWARD rules
      when: iptables_forward_rules | length > 0
      block:
        - name: Flush FORWARD chain before applying rules
          ansible.builtin.shell: sudo iptables -F FORWARD
          changed_when: true

        - name: Apply FORWARD rule with state — {{ item.comment }}
          ansible.builtin.shell: |
            sudo iptables -A FORWARD -s {{ item.src }} -d {{ item.dst }} \
              -m state --state {{ item.state }} -j {{ item.action }} \
              -m comment --comment "{{ item.comment }}"
          loop: "{{ iptables_forward_rules }}"
          when: item.state is defined
          changed_when: true

        - name: Apply FORWARD rule without state — {{ item.comment }}
          ansible.builtin.shell: |
            sudo iptables -A FORWARD -s {{ item.src }} -d {{ item.dst }} \
              -j {{ item.action }} \
              -m comment --comment "{{ item.comment }}"
          loop: "{{ iptables_forward_rules }}"
          when: item.state is not defined
          changed_when: true

        - name: Persist iptables rules
          ansible.builtin.shell: sudo sh -c 'iptables-save > /etc/iptables/rules.v4'
          changed_when: true
      rescue:
        - name: iptables apply failed — printing error
          ansible.builtin.debug:
            msg: "iptables block failed on {{ inventory_hostname }}"

    # ── 9. VERIFY ───────────────────────────────────────
    - name: Collect verification output
      ansible.builtin.shell: "{{ item.cmd }}"
      loop:
        - { cmd: "show ip interfaces",                    label: "IP interfaces" }
        - { cmd: "show ip route",                         label: "IP routes" }
        - { cmd: "sudo vtysh -c 'show running-config'",   label: "FRR config" }
        - { cmd: "sudo iptables -L FORWARD -n --line-numbers", label: "iptables FORWARD" }
      register: verify_out
      changed_when: false

    - name: Print verification for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg: "{{ item.item.label }}: {{ item.stdout }}"
      loop: "{{ verify_out.results }}"
