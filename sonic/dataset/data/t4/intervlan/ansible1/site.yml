---
- name: Clear stale SSH host keys from controller
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Remove stale known_hosts entry for each switch
      ansible.builtin.shell: |
        ssh-keygen -f "/home/SONICtestbed/.ssh/known_hosts" -R "{{ item }}" 2>/dev/null || true
      loop:
        - 192.168.100.2
        - 192.168.100.3
        - 192.168.100.4
      changed_when: false

- name: Inter-VLAN routing config push
  hosts: sonic_switches
  gather_facts: false
  serial: 1
  vars:
    _interfaces_to_clean: "{{ interfaces_to_clean }}"
    _loopbacks:           "{{ loopbacks }}"
    _interfaces:          "{{ interfaces }}"
    _portchannels:        "{{ portchannels }}"
    _vlans:               "{{ vlans }}"
    _static_routes:       "{{ static_routes }}"

  tasks:

    # ── 0. PRE-CLEAN ────────────────────────────────────
    - name: Clean bare INTERFACE entries from CONFIG_DB
      ansible.builtin.shell: |
        for key in $(sonic-db-cli CONFIG_DB keys "INTERFACE|{{ item }}|*" 2>/dev/null); do
          ip=$(echo "$key" | awk -F'|' '{print $3}')
          sudo config interface ip remove {{ item }} "$ip" 2>/dev/null || true
        done
        exists=$(sonic-db-cli CONFIG_DB exists "INTERFACE|{{ item }}" 2>/dev/null || echo "0")
        if [ "$exists" = "1" ]; then
          sonic-db-cli CONFIG_DB del "INTERFACE|{{ item }}"
          echo changed
        else
          echo ok
        fi
      register: _clean
      changed_when: "'changed' in _clean.stdout"
      loop: "{{ _interfaces_to_clean }}"

    # ── 1. LOOPBACKS ────────────────────────────────────
    - name: Create loopback interface
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "LOOPBACK_INTERFACE|{{ item.name }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config loopback add {{ item.name }} && echo changed
        else
          echo ok
        fi
      loop: "{{ _loopbacks }}"
      register: r
      changed_when: "'changed' in r.stdout"

    - name: Assign loopback IP
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "LOOPBACK_INTERFACE|{{ item.name }}|{{ item.ip }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config interface ip add {{ item.name }} {{ item.ip }} && echo changed
        else
          echo ok
        fi
      loop: "{{ _loopbacks }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 2. PORTCHANNELS ─────────────────────────────────
    - name: Create PortChannel
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "PORTCHANNEL|{{ item.name }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config portchannel add {{ item.name }} --min-links 1 && echo changed
        else
          echo ok
        fi
      loop: "{{ _portchannels }}"
      register: r
      changed_when: "'changed' in r.stdout"

    - name: Add PortChannel member
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "PORTCHANNEL_MEMBER|{{ item.name }}|{{ item.member }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config portchannel member add {{ item.name }} {{ item.member }} && echo changed
        else
          echo ok
        fi
      loop: "{{ _portchannels }}"
      register: r
      changed_when: "'changed' in r.stdout"

    - name: Assign PortChannel IP
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "PORTCHANNEL_INTERFACE|{{ item.name }}|{{ item.ip }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config interface ip add {{ item.name }} {{ item.ip }} && echo changed
        else
          echo ok
        fi
      loop: "{{ _portchannels }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 3. ROUTED INTERFACES ────────────────────────────
    - name: Assign interface IP
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "INTERFACE|{{ item.name }}|{{ item.ip }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config interface ip add {{ item.name }} {{ item.ip }} && echo changed
        else
          echo ok
        fi
      loop: "{{ _interfaces }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 4. VLANs ────────────────────────────────────────
    - name: Create VLAN
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "VLAN|Vlan{{ item.id }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config vlan add {{ item.id }} && echo changed
        else
          echo ok
        fi
      loop: "{{ _vlans }}"
      register: r
      changed_when: "'changed' in r.stdout"
      when: _vlans | length > 0

    - name: Assign VLAN SVI IP
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "VLAN_INTERFACE|Vlan{{ item.id }}|{{ item.svi_ip }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config interface ip add Vlan{{ item.id }} {{ item.svi_ip }} && echo changed
        else
          echo ok
        fi
      loop: "{{ _vlans }}"
      register: r
      changed_when: "'changed' in r.stdout"
      when: _vlans | length > 0

    - name: Add VLAN member ports
      ansible.builtin.shell: |
        exists=$(sonic-db-cli CONFIG_DB exists "VLAN_MEMBER|Vlan{{ item.0.id }}|{{ item.1.port }}" 2>/dev/null || echo "0")
        if [ "$exists" = "0" ]; then
          sudo config vlan member add {{ item.0.id }} {{ item.1.port }} \
            {% if item.1.tagging_mode == 'untagged' %}--untagged{% endif %} && echo changed
        else
          echo ok
        fi
      loop: "{{ _vlans | subelements('members') }}"
      register: r
      changed_when: "'changed' in r.stdout"
      when: _vlans | length > 0

    # ── 5. STATIC ROUTES ────────────────────────────────
    - name: Add static route via FRR
      ansible.builtin.shell: |
        existing=$(sudo vtysh -c "show running-config" 2>/dev/null \
          | grep -c "^ip route {{ item.prefix }} {{ item.nexthop }}" || true)
        if [ "$existing" = "0" ]; then
          sudo vtysh -c "configure terminal" \
                     -c "ip route {{ item.prefix }} {{ item.nexthop }}" \
                     -c "end" \
                     -c "write memory" && echo changed
        else
          echo ok
        fi
      loop: "{{ _static_routes }}"
      register: r
      changed_when: "'changed' in r.stdout"

    # ── 6. SAVE ─────────────────────────────────────────
    - name: Save SONiC config
      ansible.builtin.shell: sudo config save -y
      changed_when: true

    # ── 7. VERIFY ───────────────────────────────────────
    - name: Verify — show ip interfaces
      ansible.builtin.shell: show ip interfaces
      register: v_intf
      changed_when: false

    - name: Verify — show ip route
      ansible.builtin.shell: show ip route
      register: v_route
      changed_when: false

    - name: Verify — show FRR running config
      ansible.builtin.shell: sudo vtysh -c "show running-config"
      register: v_frr
      changed_when: false

    - name: Print verification for {{ inventory_hostname }}
      ansible.builtin.debug:
        msg:
          - "━━━ {{ inventory_hostname }} ━━━"
          - "── IP interfaces ──"
          - "{{ v_intf.stdout }}"
          - "── IP routes ──"
          - "{{ v_route.stdout }}"
          - "── FRR config ──"
          - "{{ v_frr.stdout }}"
