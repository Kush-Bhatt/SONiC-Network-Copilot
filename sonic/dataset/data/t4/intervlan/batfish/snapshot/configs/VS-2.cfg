! SONiC VS-2 — Inter-VLAN routing with Vlan200
!
hostname VS-2
!
interface Loopback0
 ip address 10.1.0.1 255.255.255.255
 no shutdown
!
interface Loopback1
 ip address 10.2.0.2 255.255.255.255
 no shutdown
!
interface Port-channel12
 ip address 10.0.12.2 255.255.255.252
 no shutdown
!
interface Port-channel23
 ip address 10.0.23.1 255.255.255.252
 no shutdown
!
interface Vlan200
 ip address 10.0.1.254 255.255.255.0
 no shutdown
!
interface Ethernet4
 channel-group 12 mode active
 no shutdown
!
interface Ethernet20
 channel-group 23 mode active
 no shutdown
!
interface Ethernet8
 ip address 192.168.100.3 255.255.255.0
 no shutdown
!
interface Ethernet12
 switchport access vlan 200
 switchport mode access
 no shutdown
!
interface Ethernet16
 switchport access vlan 200
 switchport mode access
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.0.23.2
ip route 10.0.1.0 255.255.255.0 10.0.12.1
ip route 10.0.2.0 255.255.255.0 10.0.12.1
ip route 10.0.1.10 255.255.255.255 10.0.12.1
ip route 10.0.1.20 255.255.255.255 10.0.12.1
ip route 10.0.1.253 255.255.255.255 10.0.12.1
!
