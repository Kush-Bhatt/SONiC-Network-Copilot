---
########################################
# Single Switch BGP Automation — block/rescue style
# VS-1 = ASN 65001
########################################
- name: Configure BGP on VS-1
  hosts: vs-1
  gather_facts: false
  vars:
    bgp_asn: 65001
    router_id: 192.168.100.2
    neighbor_ip: 10.0.0.1
    neighbor_asn: 65002
    neighbor_desc: to-vs-3
    advertise_prefix: 192.168.10.0/24

  tasks:
    # BGP removal stays unconditional, not gated by rescue —
    # vtysh often doesn't error on an existing instance, it just
    # opens config mode and appends, so rescue would never fire.
    - name: Remove existing BGP config on VS-1
      shell: vtysh -c "configure terminal" -c "no router bgp {{ bgp_asn }}" -c "end"
      ignore_errors: true
      changed_when: true

    - name: Configure BGP on VS-1
      block:
        - name: Push BGP config on VS-1
          shell: |
            vtysh -c "configure terminal" \
                  -c "router bgp {{ bgp_asn }}" \
                  -c "bgp router-id {{ router_id }}" \
                  -c "bgp log-neighbor-changes" \
                  -c "no bgp ebgp-requires-policy" \
                  -c "neighbor {{ neighbor_ip }} remote-as {{ neighbor_asn }}" \
                  -c "neighbor {{ neighbor_ip }} description {{ neighbor_desc }}" \
                  -c "neighbor {{ neighbor_ip }} timers 3 9" \
                  -c "address-family ipv4 unicast" \
                  -c "network {{ advertise_prefix }}" \
                  -c "neighbor {{ neighbor_ip }} activate" \
                  -c "neighbor {{ neighbor_ip }} soft-reconfiguration inbound" \
                  -c "end"
          changed_when: true
      rescue:
        - name: VS-1 BGP push failed — printing error
          debug:
            msg: "BGP config block failed on VS-1, check vtysh manually"

    - name: Save FRR config on VS-1
      shell: vtysh -c "write memory"
      changed_when: true

    - name: Save SONiC config
      shell: config save -y
      changed_when: true

    - name: Show BGP summary on VS-1
      shell: vtysh -c "show bgp summary"
      register: bgp_out
      changed_when: false

    - name: Print BGP summary on VS-1
      debug:
        var: bgp_out.stdout
