---
- name: Configure VLAN10 on SONiC-VS-1 for Alpine PCs — batch-script style
  hosts: vs-1
  gather_facts: no
  become: yes
  vars:
    vlan_id: 10
    vlan_gateway_ip: "192.168.10.1/24"
    vlan_ports:
      - Ethernet8
      - Ethernet12
      - Ethernet16
      - Ethernet20
      - Ethernet24

  tasks:
    # Single combined script: checks and configures VLAN, all five
    # port memberships, and the SVI IP in one shell invocation
    # instead of three separate task-per-operation calls.
    - name: Run combined VLAN10 setup script
      shell: |
        vlan_exists=$(show vlan brief | grep -w {{ vlan_id }})
        [ -z "$vlan_exists" ] && config vlan add {{ vlan_id }}

        {% for p in vlan_ports %}
        port_member_{{ loop.index }}=$(show vlan brief | grep -w {{ p }})
        [ -z "$port_member_{{ loop.index }}" ] && config vlan member add -u {{ vlan_id }} {{ p }}
        {% endfor %}

        ip_exists=$(show ip interfaces | grep -w {{ vlan_gateway_ip }})
        [ -z "$ip_exists" ] && config interface ip add Vlan{{ vlan_id }} {{ vlan_gateway_ip }}

        config save -y
        vtysh -c "write memory"
        command -v netfilter-persistent >/dev/null 2>&1 && netfilter-persistent save || true
      changed_when: true

    - name: Verify VLAN10 configuration
      command: "show vlan brief"
      register: vlan_brief
      changed_when: false

    - name: Display VLAN10 verification output
      debug:
        var: vlan_brief.stdout_lines
