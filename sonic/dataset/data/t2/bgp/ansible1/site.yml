---
########################################
# Ring Topology BGP Automation — block/rescue style
########################################

- name: Configure VS-1
  hosts: vs-1
  gather_facts: false
  tasks:
    - name: Configure VS-1 links
      block:
        - name: Assign IP on Ethernet4 (→ VS-2)
          shell: config interface ip add Ethernet4 10.0.12.1/30
          changed_when: true

        - name: Assign IP on Ethernet8 (→ VS-3)
          shell: config interface ip add Ethernet8 10.0.13.1/30
          changed_when: true
      rescue:
        - name: VS-1 link config failed — cleaning and retrying
          shell: |
            config interface ip remove Ethernet4 10.0.12.1/30 2>/dev/null || true
            config interface ip remove Ethernet8 10.0.13.1/30 2>/dev/null || true
          changed_when: true

        - name: Retry VS-1 link config
          shell: |
            config interface ip add Ethernet4 10.0.12.1/30
            config interface ip add Ethernet8 10.0.13.1/30
          changed_when: true

    - name: Save SONiC config
      shell: config save -y
      changed_when: true

    # BGP removal stays unconditional, not gated by rescue —
    # vtysh often doesn't error on an existing instance, it just
    # opens config mode and appends, so rescue would never fire.
    - name: Remove existing BGP config on VS-1
      shell: vtysh -c "configure terminal" -c "no router bgp 65001" -c "end"
      ignore_errors: true
      changed_when: true

    - name: Configure BGP on VS-1
      block:
        - name: Push BGP config on VS-1
          shell: |
            vtysh -c "configure terminal" \
                  -c "router bgp 65001" \
                  -c "bgp router-id 10.0.12.1" \
                  -c "bgp log-neighbor-changes" \
                  -c "no bgp ebgp-requires-policy" \
                  -c "neighbor 10.0.12.2 remote-as 65002" \
                  -c "neighbor 10.0.12.2 description VS-2" \
                  -c "neighbor 10.0.12.2 timers 3 9" \
                  -c "neighbor 10.0.13.2 remote-as 65003" \
                  -c "neighbor 10.0.13.2 description VS-3" \
                  -c "neighbor 10.0.13.2 timers 3 9" \
                  -c "address-family ipv4 unicast" \
                  -c "neighbor 10.0.12.2 activate" \
                  -c "neighbor 10.0.12.2 soft-reconfiguration inbound" \
                  -c "neighbor 10.0.13.2 activate" \
                  -c "neighbor 10.0.13.2 soft-reconfiguration inbound" \
                  -c "end"
          changed_when: true
      rescue:
        - name: VS-1 BGP push failed — printing error
          debug:
            msg: "BGP config block failed on VS-1, check vtysh manually"

    - name: Save FRR config on VS-1
      shell: vtysh -c "write memory"
      changed_when: true

    - name: Show BGP summary on VS-1
      shell: vtysh -c "show bgp summary"
      register: bgp_out
      changed_when: false

    - name: Print BGP summary on VS-1
      debug:
        var: bgp_out.stdout


- name: Configure VS-2
  hosts: vs-2
  gather_facts: false
  tasks:
    - name: Configure VS-2 links
      block:
        - name: Assign IP on Ethernet8 (→ VS-1)
          shell: config interface ip add Ethernet8 10.0.12.2/30
          changed_when: true

        - name: Assign IP on Ethernet4 (→ VS-4)
          shell: config interface ip add Ethernet4 10.0.24.1/30
          changed_when: true
      rescue:
        - name: VS-2 link config failed — cleaning and retrying
          shell: |
            config interface ip remove Ethernet8 10.0.12.2/30 2>/dev/null || true
            config interface ip remove Ethernet4 10.0.24.1/30 2>/dev/null || true
          changed_when: true

        - name: Retry VS-2 link config
          shell: |
            config interface ip add Ethernet8 10.0.12.2/30
            config interface ip add Ethernet4 10.0.24.1/30
          changed_when: true

    - name: Save SONiC config
      shell: config save -y
      changed_when: true

    - name: Remove existing BGP config on VS-2
      shell: vtysh -c "configure terminal" -c "no router bgp 65002" -c "end"
      ignore_errors: true
      changed_when: true

    - name: Configure BGP on VS-2
      block:
        - name: Push BGP config on VS-2
          shell: |
            vtysh -c "configure terminal" \
                  -c "router bgp 65002" \
                  -c "bgp router-id 10.0.12.2" \
                  -c "bgp log-neighbor-changes" \
                  -c "no bgp ebgp-requires-policy" \
                  -c "neighbor 10.0.12.1 remote-as 65001" \
                  -c "neighbor 10.0.12.1 description VS-1" \
                  -c "neighbor 10.0.12.1 timers 3 9" \
                  -c "neighbor 10.0.24.2 remote-as 65004" \
                  -c "neighbor 10.0.24.2 description VS-4" \
                  -c "neighbor 10.0.24.2 timers 3 9" \
                  -c "address-family ipv4 unicast" \
                  -c "neighbor 10.0.12.1 activate" \
                  -c "neighbor 10.0.12.1 soft-reconfiguration inbound" \
                  -c "neighbor 10.0.24.2 activate" \
                  -c "neighbor 10.0.24.2 soft-reconfiguration inbound" \
                  -c "end"
          changed_when: true
      rescue:
