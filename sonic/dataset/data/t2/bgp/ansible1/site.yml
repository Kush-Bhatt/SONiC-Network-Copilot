- name: Configure VS-4 (with Loopback advertisement)
  hosts: vs-4
  gather_facts: false
  tasks:
    - name: Configure VS-4 links and loopback
      block:
        - name: Assign IP on Ethernet20 (→ VS-2)
          shell: config interface ip add Ethernet20 10.0.24.2/30
          changed_when: true

        - name: Assign IP on Ethernet16 (→ VS-3)
          shell: config interface ip add Ethernet16 10.0.34.2/30
          changed_when: true

        - name: Add Loopback0 IP
          shell: config interface ip add Loopback0 10.4.4.4/32
          changed_when: true
      rescue:
        - name: VS-4 link/loopback config failed — cleaning and retrying
          shell: |
            config interface ip remove Ethernet20 10.0.24.2/30 2>/dev/null || true
            config interface ip remove Ethernet16 10.0.34.2/30 2>/dev/null || true
            config interface ip remove Loopback0 10.4.4.4/32 2>/dev/null || true
          changed_when: true

        - name: Retry VS-4 link/loopback config
          shell: |
            config interface ip add Ethernet20 10.0.24.2/30
            config interface ip add Ethernet16 10.0.34.2/30
            config interface ip add Loopback0 10.4.4.4/32
          changed_when: true

    - name: Save SONiC config
      shell: config save -y
      changed_when: true

    - name: Remove existing BGP config on VS-4
      shell: vtysh -c "configure terminal" -c "no router bgp 65004" -c "end"
      ignore_errors: true
      changed_when: true

    - name: Configure BGP on VS-4 with loopback advertisement
      block:
        - name: Push BGP config on VS-4
          shell: |
            vtysh -c "configure terminal" \
                  -c "router bgp 65004" \
                  -c "bgp router-id 10.0.24.2" \
                  -c "bgp log-neighbor-changes" \
                  -c "no bgp ebgp-requires-policy" \
                  -c "neighbor 10.0.24.1 remote-as 65002" \
                  -c "neighbor 10.0.24.1 description VS-2" \
                  -c "neighbor 10.0.24.1 timers 3 9" \
                  -c "neighbor 10.0.34.1 remote-as 65003" \
                  -c "neighbor 10.0.34.1 description VS-3" \
                  -c "neighbor 10.0.34.1 timers 3 9" \
                  -c "address-family ipv4 unicast" \
                  -c "network 10.4.4.4/32" \
                  -c "neighbor 10.0.24.1 activate" \
                  -c "neighbor 10.0.24.1 soft-reconfiguration inbound" \
                  -c "neighbor 10.0.34.1 activate" \
                  -c "neighbor 10.0.34.1 soft-reconfiguration inbound" \
                  -c "end"
          changed_when: true
      rescue:
        - name: VS-4 BGP push failed — printing error
          debug:
            msg: "BGP config block failed on VS-4, check vtysh manually"

    - name: Save FRR config on VS-4
      shell: vtysh -c "write memory"
      changed_when: true

    - name: Show BGP summary on VS-4
      shell: vtysh -c "show bgp summary"
      register: bgp_out
      changed_when: false

    - name: Print BGP summary on VS-4
      debug:
        var: bgp_out.stdout


- name: Final verification across all switches
  hosts: vs-1:vs-2:vs-3
  gather_facts: false
  tasks:
    - name: Wait for BGP convergence
      pause:
        seconds: 10

    - name: Check if loopback route is learned
      shell: ip route show 10.4.4.4/32
      register: route_check
      changed_when: false

    - name: Print loopback route status
      debug:
        var: route_check.stdout
