---
########################################
# Ring Topology BGP Automation — register/when chaining style
########################################

- name: Configure VS-1
  hosts: vs-1
  gather_facts: false
  vars:
    links:
      - { iface: Ethernet4, ip: 10.0.12.1/30 }
      - { iface: Ethernet8, ip: 10.0.13.1/30 }
    bgp_asn: 65001
  tasks:
    - name: Check current IP on each VS-1 link
      shell: show ip interfaces | grep "^{{ item.iface }}" | awk '{print $2}' || true
      loop: "{{ links }}"
      loop_control:
        label: "{{ item.iface }}"
      register: link_check
      changed_when: false
      ignore_errors: true

    - name: Assign IP if missing on VS-1 link
      shell: config interface ip add {{ item.item.iface }} {{ item.item.ip }}
      loop: "{{ link_check.results }}"
      loop_control:
        label: "{{ item.item.iface }}"
      when: item.stdout != item.item.ip
      changed_when: true

    - name: Save SONiC config
      shell: config save -y
      changed_when: true

    - name: Check if BGP instance already exists on VS-1
      shell: vtysh -c "show running-config" | grep -c "^router bgp {{ bgp_asn }}" || true
      register: bgp_check
      changed_when: false

    - name: Remove existing BGP instance if present
      shell: vtysh -c "configure terminal" -c "no router bgp {{ bgp_asn }}" -c "end"
      when: bgp_check.stdout != "0"
      changed_when: true

    - name: Configure BGP on VS-1
      shell: |
        vtysh -c "configure terminal" \
              -c "router bgp 65001" \
              -c "bgp router-id 10.0.12.1" \
              -c "bgp log-neighbor-changes" \
              -c "no bgp ebgp-requires-policy" \
              -c "neighbor 10.0.12.2 remote-as 65002" \
              -c "neighbor 10.0.12.2 description VS-2" \
              -c "neighbor 10.0.12.2 timers 3 9" \
              -c "neighbor 10.0.13.2 remote-as 65003" \
              -c "neighbor 10.0.13.2 description VS-3" \
              -c "neighbor 10.0.13.2 timers 3 9" \
              -c "address-family ipv4 unicast" \
              -c "neighbor 10.0.12.2 activate" \
              -c "neighbor 10.0.12.2 soft-reconfiguration inbound" \
              -c "neighbor 10.0.13.2 activate" \
              -c "neighbor 10.0.13.2 soft-reconfiguration inbound" \
              -c "end"
      changed_when: true

    - name: Save FRR config on VS-1
      shell: vtysh -c "write memory"
      changed_when: true

    - name: Show BGP summary on VS-1
      shell: vtysh -c "show bgp summary"
      register: bgp_out
      changed_when: false

    - name: Print BGP summary on VS-1
      debug:
        var: bgp_out.stdout


