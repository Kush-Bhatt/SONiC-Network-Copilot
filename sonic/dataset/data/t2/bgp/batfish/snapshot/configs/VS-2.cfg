! IOS-style configuration for Batfish
! Ring Topology BGP - VS-2 (AS 65002), peers: VS-1, VS-4
!
frr version 10.5.1
frr defaults traditional
hostname VS-2
!
interface Ethernet8
 ip address 10.0.12.2/30
 no shutdown
!
interface Ethernet4
 ip address 10.0.24.1/30
 no shutdown
!
router bgp 65002
 bgp router-id 10.0.12.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.0.12.1 remote-as 65001
 neighbor 10.0.12.1 description VS-1
 neighbor 10.0.12.1 timers 3 9
 neighbor 10.0.24.2 remote-as 65004
 neighbor 10.0.24.2 description VS-4
 neighbor 10.0.24.2 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.0.12.1 activate
  neighbor 10.0.12.1 soft-reconfiguration inbound
  neighbor 10.0.24.2 activate
  neighbor 10.0.24.2 soft-reconfiguration inbound
 exit-address-family
!
end
