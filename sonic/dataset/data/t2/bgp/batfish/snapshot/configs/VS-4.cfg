! IOS-style configuration for Batfish
! Ring Topology BGP - VS-4 (AS 65004), peers: VS-2, VS-3
! Loopback0 advertised into BGP
!
frr version 10.5.1
frr defaults traditional
hostname VS-4
!
interface Loopback0
 ip address 10.4.4.4/32
!
interface Ethernet20
 ip address 10.0.24.2/30
 no shutdown
!
interface Ethernet16
 ip address 10.0.34.2/30
 no shutdown
!
router bgp 65004
 bgp router-id 10.0.24.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.0.24.1 remote-as 65002
 neighbor 10.0.24.1 description VS-2
 neighbor 10.0.24.1 timers 3 9
 neighbor 10.0.34.1 remote-as 65003
 neighbor 10.0.34.1 description VS-3
 neighbor 10.0.34.1 timers 3 9
 !
 address-family ipv4 unicast
  network 10.4.4.4/32
  neighbor 10.0.24.1 activate
  neighbor 10.0.24.1 soft-reconfiguration inbound
  neighbor 10.0.34.1 activate
  neighbor 10.0.34.1 soft-reconfiguration inbound
 exit-address-family
!
end
