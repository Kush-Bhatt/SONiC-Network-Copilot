! IOS-style configuration for Batfish
! Ring Topology BGP - VS-3 (AS 65003), peers: VS-1, VS-4
!
frr version 10.5.1
frr defaults traditional
hostname VS-3
!
interface Ethernet8
 ip address 10.0.13.2/30
 no shutdown
!
interface Ethernet4
 ip address 10.0.34.1/30
 no shutdown
!
router bgp 65003
 bgp router-id 10.0.13.2
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 65001
 neighbor 10.0.13.1 description VS-1
 neighbor 10.0.13.1 timers 3 9
 neighbor 10.0.34.2 remote-as 65004
 neighbor 10.0.34.2 description VS-4
 neighbor 10.0.34.2 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.0.13.1 activate
  neighbor 10.0.13.1 soft-reconfiguration inbound
  neighbor 10.0.34.2 activate
  neighbor 10.0.34.2 soft-reconfiguration inbound
 exit-address-family
!
end
