! IOS-style configuration for Batfish
! Ring Topology BGP - VS-1 (AS 65001), peers: VS-2, VS-3
!
frr version 10.5.1
frr defaults traditional
hostname VS-1
!
interface Ethernet4
 ip address 10.0.12.1/30
 no shutdown
!
interface Ethernet8
 ip address 10.0.13.1/30
 no shutdown
!
router bgp 65001
 bgp router-id 10.0.12.1
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 65002
 neighbor 10.0.12.2 description VS-2
 neighbor 10.0.12.2 timers 3 9
 neighbor 10.0.13.2 remote-as 65003
 neighbor 10.0.13.2 description VS-3
 neighbor 10.0.13.2 timers 3 9
 !
 address-family ipv4 unicast
  neighbor 10.0.12.2 activate
  neighbor 10.0.12.2 soft-reconfiguration inbound
  neighbor 10.0.13.2 activate
  neighbor 10.0.13.2 soft-reconfiguration inbound
 exit-address-family
!
end
