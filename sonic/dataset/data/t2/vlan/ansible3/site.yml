---
- name: Configure VLAN10 on SONiC-VS-4 (access switch for Alpine nodes) — register/when chaining style
  hosts: vs-4
  gather_facts: no
  become: yes
  vars:
    vlan_id: 10
    vlan_name: "Vlan10"
    vlan_ip: "10.0.2.1/24"
    access_ports:
      - Ethernet4
      - Ethernet8

  tasks:
    - name: Check if VLAN10 already exists
      ansible.builtin.shell: "show vlan brief | grep -w {{ vlan_id }} || true"
      register: vlan_check
      changed_when: false

    - name: Create VLAN10 if missing
      ansible.builtin.shell: "config vlan add {{ vlan_id }}"
      when: vlan_check.stdout | length == 0
      changed_when: true

    - name: Check VLAN10 member status for each access port
      ansible.builtin.shell: "show vlan brief | grep -w {{ item }} || true"
      loop: "{{ access_ports }}"
      loop_control:
        label: "{{ item }}"
      register: port_check
      changed_when: false

    - name: Add access port as untagged member if missing
      ansible.builtin.shell: "config vlan member add {{ vlan_id }} {{ item.item }} -u"
      loop: "{{ port_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stdout | length == 0
      changed_when: true

    - name: Check if Vlan10 SVI already has the desired IP
      ansible.builtin.shell: "show ip interfaces | grep -w {{ vlan_ip }} || true"
      register: vlan_ip_check
      changed_when: false

    - name: Check current Vlan10 SVI IP if different
      ansible.builtin.shell: "show ip interfaces | grep '^{{ vlan_name }}' | awk '{print $2}' || true"
      register: current_vlan_ip
      changed_when: false
      when: vlan_ip_check.stdout | length == 0

    - name: Remove stale Vlan10 SVI IP if present and different
      ansible.builtin.shell: "config interface ip remove {{ vlan_name }} {{ current_vlan_ip.stdout }}"
      when:
        - vlan_ip_check.stdout | length == 0
        - current_vlan_ip.stdout is defined
        - current_vlan_ip.stdout | length > 0
        - current_vlan_ip.stdout != vlan_ip
      changed_when: true

    - name: Assign IP to Vlan10 SVI if missing
      ansible.builtin.shell: "config interface ip add {{ vlan_name }} {{ vlan_ip }}"
      when: vlan_ip_check.stdout | length == 0
      changed_when: true

    - name: Save running configuration
      ansible.builtin.shell: "config save -y"
      changed_when: true

    - name: Verify VLAN10 brief
      ansible.builtin.shell: "show vlan brief"
      register: vlan_brief
      changed_when: false

    - name: Display VLAN10 brief output
      debug:
        msg: "{{ vlan_brief.stdout }}"

    - name: Verify IP interfaces
      ansible.builtin.shell: "show ip interfaces"
      register: ip_intf
      changed_when: false

    - name: Display IP interfaces output
      debug:
        msg: "{{ ip_intf.stdout }}"
